tag: MoeMotion_cross_moe_mlp

pl_module:
  _target_: realmotion.model.pl_modules.Cross_moe_mlp_Module
  model:
    _target_: realmotion.model.moemotion.MoeMotion
    embed_dim: 128
    mlp_dim: 128
    future_steps: ${n_step}
    future_len: ${future_len}
    encoder_depth: 4
    num_heads: 8
    mlp_ratio: 2.0
    qkv_bias: False
    drop_path: 0.2
    mlp_drop: 0.0
    moe: True
    moe_type: "cross_moe_mlp"
    query_cross_layers: 2
    query_self_atten: True
    query_self_layers: 1
    num_experts: ${num_experts}
    top_k: ${top_k}
    modes: 6
    attn_moe_mlp: True
  optim:
    lr: 1e-3
    weight_decay: 1e-2
    min_lr: 1e-5
    epochs: ${epochs}
    warmup_ratio: 0.167
