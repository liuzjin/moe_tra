tag: MoeMotion

pl_module:
  _target_: realmotion.model.pl_modules.RegressionLightningModule
  total_epochs: ${epochs}
  modes: 6
  k: 2
  n: 6
  logits_max: True
  history_frames: 50
  schedule_type: 'linear'
  model:
    _target_: realmotion.model.moemotion.MoeMotion
    embed_dim: 128
    future_steps: 10
    encoder_depth: 4
    num_heads: 8
    mlp_ratio: 4.0
    qkv_bias: False
    drop_path: 0.2
    use_stream_encoder: True
    use_stream_decoder: True
    num_experts: 9
    top_k: 2
  optim:
    lr: 1e-3
    weight_decay: 1e-2
    min_lr: 1e-5
    epochs: ${epochs}
    warmup_ratio: 0.167
